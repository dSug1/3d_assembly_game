name: Deploy to GitHub Pages

# ⭐ WHY THIS EXISTS: a real HTTPS origin on any device, including an iPhone with no
# Mac and no cable. That matters more than it sounds -- DeviceOrientation (spec rule
# 1's tilt-orbit) and most sensor APIs require a SECURE CONTEXT, and a plain-HTTP LAN
# address is not one. See Claude/50_BUILD_DEPLOY/INDEX.md.
#
# ⚠ It is NOT the fast loop. Push -> build -> deploy is 1-3 minutes, and tuning a
# gesture threshold by feel needs seconds. Use USB or LAN for that; use this to check
# the real production bundle and to test on a device you cannot plug in.
#
# ⭐ ONE BUILD, AT THE ROOT (2026-10-10, the owner: *"I want to simplify and retain only the proto from now on. It shall
# not be a separate webpage .../proto/ any longer but be what the main merge from and serve on .../3d_assembly_game/.
# There is no need to have repository variables any longer from this 1.0.62- branch onwards"*). The branch that
# triggered the run (main, on a push) is built into the site's root -- since 1.0.62- that IS the orbiting prototype.
# See Claude/50_BUILD_DEPLOY/DEPLOY_GITHUB_PAGES.md.
#
# ⭐⭐ A PROTOTYPE AT /proto/ AGAIN (2026-11-13, the owner: *"for the deploy in github webpage, create this as a prototype
# (as we did in a couple of previous branches) so I can test it independently of main"*). ⛔ No repository variable (the
# 2026-10-10 rule): the branch is named in the FILE `.github/proto_branch` on main (its first line; empty, absent or
# `none`: no /proto/). The root is main's, untouched; the prototype is built from its own branch, gated by its own
# `npm run verify`, into /proto/ (`base: "./"` lets a build live in a subfolder). Every deploy replaces the whole site,
# so as long as the file names a branch, every deploy of main rebuilds /proto/ beside it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# ⭐ Never two deploys at once, and never cancel a running one half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── the ROOT: the branch that triggered the run (main, on a push) ──
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # ⭐ (2026-10-10) off Node 20: the v5 actions run on Node 24, and the build on Node 22 (the deploy run warned since 2026-10-02)
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ⛔ THE GATE RUNS BEFORE THE DEPLOY. A build that fails its golden vectors must
      # not reach a device -- otherwise the device look is testing something nobody
      # verified, which is how "it works on my machine" becomes "it shipped".
      - name: Typecheck and golden vectors
        run: npm run verify

      # ⭐ (2026-11-04, the audit) `vite build` alone: `npm run verify` above already typechecked.
      - run: npx vite build

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist

  # ── /proto/: the branch named in `.github/proto_branch`, when one is ──
  proto:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      branch: ${{ steps.name.outputs.branch }}
    steps:
      - uses: actions/checkout@v5

      - id: name
        name: The prototype's branch (.github/proto_branch)
        run: |
          b=""
          if [ -f .github/proto_branch ]; then b="$(head -n 1 .github/proto_branch | tr -d '\r' | xargs)"; fi
          if [ "$b" = "none" ]; then b=""; fi
          echo "branch=$b" >> "$GITHUB_OUTPUT"
          echo "prototype branch: '${b}'"

      - if: steps.name.outputs.branch != ''
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.name.outputs.branch }}

      - if: steps.name.outputs.branch != ''
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - if: steps.name.outputs.branch != ''
        run: npm ci

      - if: steps.name.outputs.branch != ''
        name: Typecheck and golden vectors (prototype)
        run: npm run verify

      # ⛔ The build id is read from GITHUB_SHA (vite.config.ts), which is the TRIGGERING commit -- main's -- so /proto/
      # was labelled with main's sha (seen live, 2026-10-01). Its own checkout's commit, so the HUD's `build` line names
      # the code on screen.
      - if: steps.name.outputs.branch != ''
        name: Build (labelled with its own commit)
        run: GITHUB_SHA="$(git rev-parse HEAD)" npx vite build

      - if: steps.name.outputs.branch != ''
        uses: actions/upload-artifact@v4
        with:
          name: proto
          path: dist

  # ── the site assembled: the root, and /proto/ inside it ──
  package:
    needs: [build, proto]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - if: needs.proto.outputs.branch != ''
        uses: actions/download-artifact@v4
        with:
          name: proto
          path: dist/proto

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
