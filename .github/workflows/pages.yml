name: Deploy to GitHub Pages

# ⭐ WHY THIS EXISTS: a real HTTPS origin on any device, including an iPhone with no
# Mac and no cable. That matters more than it sounds -- DeviceOrientation (spec rule
# 1's tilt-orbit) and most sensor APIs require a SECURE CONTEXT, and a plain-HTTP LAN
# address is not one. See Claude/50_BUILD_DEPLOY/INDEX.md.
#
# ⚠ It is NOT the fast loop. Push -> build -> deploy is 1-3 minutes, and tuning a
# gesture threshold by feel needs seconds. Use USB or LAN for that; use this to check
# the real production bundle and to test on a device you cannot plug in.
#
# ⭐ TWO BUILDS, ONE SITE (2026-10-01): the branch that triggered the run is built into the
# site's ROOT (main, on a push), and -- optionally -- a SECOND branch into /proto/, each
# gated by its own `npm run verify`. A repository has one Pages site and every deploy
# replaces it whole, so this is how a prototype branch is tested beside the main line
# without either overwriting the other. ⭐ The second branch is named OUTSIDE the code: the
# `proto_branch` field of "Run workflow", else the repository variable PROTO_BRANCH
# (Settings -> Secrets and variables -> Actions -> Variables); empty or `none` = no /proto/.
# See Claude/50_BUILD_DEPLOY/DEPLOY_GITHUB_PAGES.md, "A second build at /proto/".

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      proto_branch:
        description: "Branch built into /proto/ (empty: the PROTO_BRANCH variable; none: no /proto/)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

# ⭐ Never two deploys at once, and never cancel a running one half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # ⭐ The run's own field wins; else the repository variable; empty or `none` = no /proto/.
      PROTO: ${{ github.event.inputs.proto_branch || vars.PROTO_BRANCH }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # ⛔ THE GATE RUNS BEFORE THE DEPLOY. A build that fails its golden vectors must
      # not reach a device -- otherwise the device look is testing something nobody
      # verified, which is how "it works on my machine" becomes "it shipped".
      - name: Typecheck and golden vectors
        run: npm run verify

      - run: npm run build

      # ⭐ THE SECOND BUILD, into /proto/ -- AFTER the root's verify and build, so its checkout
      # cannot leak into them. ⛔ Gated the same way: a red prototype fails the whole run, and
      # nothing is deployed (the site stays as it was). ⭐ `base: "./"` and the page's relative
      # `version.json` are what let a build live in a subfolder; its HUD `build` line names it.
      - name: Check out the prototype branch
        if: env.PROTO != '' && env.PROTO != 'none'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PROTO }}
          path: proto-src

      - name: Prototype -- install, verify, build into dist/proto
        if: env.PROTO != '' && env.PROTO != 'none'
        working-directory: proto-src
        run: |
          npm ci
          npm run verify
          npm run build
          mkdir -p ../dist/proto
          cp -r dist/. ../dist/proto/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
