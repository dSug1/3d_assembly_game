<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- ⛔ `user-scalable=no` and `maximum-scale=1` are load-bearing: without them
         the browser's own pinch-zoom competes with the two-finger approach (the pinch),
         and a two-finger gesture becomes unpredictable. ⚠ iOS Safari ignores them:
         its pinch events are cancelled in `src/render/browser_guards.ts`. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>3D Assembly</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
        background: #14161a;
        /* ⛔ The browser must not claim the gestures. */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        /* ⭐ (2026-11-13) no long-press callout (iOS) — the loupe itself needs the canvas's touch events cancelled: `render/browser_guards.ts` */
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #app {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
